<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索无限可能 · 精品展示页</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶部导航 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
        }

        /* Hero 区域 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }

        /* 背景微光光晕效果 */
        .hero::before {
            content: "";
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px);
            z-index: -1;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.2rem;
            max-width: 800px;
            font-weight: 800;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2.5rem;
        }

        .cta-btn {
            display: inline-block;
            background: var(--primary-gradient);
            color: white;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6);
        }

        /* 特性卡片区域 */
        .features {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.8rem;
        }

        .card p {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 页脚 */
        footer {
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }
            .hero p {
                font-size: 1rem;
            }
            nav {
                display: none; /* 简化移动端显示 */
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <div class="logo">Aura.</div>
        <nav>
            <a href="#features">功能特性</a>
            <a href="#about">关于我们</a>
            <a href="#contact">联系方式</a>
        </nav>
    </header>

    <!-- 主展示区 -->
    <section class="hero">
        <span class="badge">✨ 全新设计系统上线</span>
        <h1>用优雅与极简，重塑数字化体验</h1>
        <p>提供优雅且高度自定义的响应式设计组件，帮助你快速打造属于自己的高质感主页或产品展示中心。</p>
        <a href="#features" class="cta-btn">立即开始探索</a>
    </section>

    <!-- 特性展示网格 -->
    <section class="features" id="features">
        <div class="card">
            <div class="card-icon">⚡</div>
            <h3>轻量极速</h3>
            <p>零外部依赖库，纯原生 HTML/CSS 实现，极致的加载体验与丝滑的交互动画。</p>
        </div>

        <div class="card">
            <div class="card-icon">🎨</div>
            <h3>暗色美学</h3>
            <p>基于暗色现代风格与细腻的渐变微光，营造高端、深邃的视觉观感。</p>
        </div>

        <div class="card">
            <div class="card-icon">📱</div>
            <h3>全平台适配</h3>
            <p>智能响应式栅格布局，在手机、平板与桌面宽屏上均能呈现完美的排版效果。</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 Aura Design. 保持简洁，追求卓越。</p>
    </footer>

</body>
</html>
